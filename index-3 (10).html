<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  html,body{
    width:100%;height:100%;
    overflow:hidden;
    background:#0a0a0a;
    font-family:'Segoe UI',Arial,sans-serif;
    color:#fff;
  }

  .page{
    display:flex;
    flex-direction:column;
    width:100vw;
    height:100dvh;
    background:#0a0a0a;
  }

  /* IMAGEM quadrada */
  .col-img{
    width:100%;
    aspect-ratio:1/1;
    overflow:hidden;
    flex-shrink:0;
  }
  .col-img img{
    width:100%;height:100%;
    object-fit:cover;
    object-position:center top;
    display:block;
  }

  /* CONTEÚDO — tudo encostado no topo */
  .col-content{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:center;
    padding:10px 14px 8px;
    gap:6px;
    border-top:2px solid #222;
    min-height:0;
  }

  /* BOTÃO */
  .btn-wpp{
    display:flex;align-items:center;justify-content:center;
    gap:12px;width:100%;padding:15px 18px;
    border-radius:13px;
    font-size:18px;font-weight:900;
    text-decoration:none;text-transform:uppercase;letter-spacing:.4px;
    background:linear-gradient(135deg,#FFD000,#FFAA00);
    color:#000;border:none;cursor:pointer;
    animation:glow 2s ease-in-out infinite;
    transition:filter .15s,transform .15s;
  }
  .btn-wpp:active{transform:scale(.97)}
  @keyframes glow{
    0%,100%{box-shadow:0 0 22px rgba(255,208,0,.5)}
    50%{box-shadow:0 0 38px rgba(255,208,0,.9)}
  }

  /* ícone WhatsApp — círculo verde, borda branca, telefone grande */
  .wpp-icon{
    width:34px;height:34px;flex-shrink:0;
    background:#25D366;
    border-radius:50%;
    border:2.5px solid #fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1.5px #1da851;
  }
  .wpp-icon svg{width:22px;height:22px;}

  /* CONTADOR */
  .contador{
    font-size:12px;color:#666;font-weight:600;text-align:center;
    width:100%;
  }
  #timer{color:#ff4444;font-weight:900;font-size:14px}

  /* PROVA */
  .prova{font-size:11px;color:#555;text-align:center;width:100%}
  .prova strong{color:#FFD000}

  /* LOGOS */
  .lojas{
    display:flex;align-items:center;
    justify-content:space-between;
    width:100%;gap:8px;
    padding-top:6px;
    border-top:1px solid #1e1e1e;
    margin-top:2px;
  }

  .badge-amazon{
    flex:1;display:flex;align-items:center;justify-content:center;
    gap:4px;padding:6px 8px;border-radius:8px;
    background:#131921;border:1px solid #f90;
  }
  .badge-amazon .a-text{
    font-family:'Arial Black',Arial;font-weight:900;
    font-size:13px;color:#f90;letter-spacing:-.5px;line-height:1;
  }
  .badge-amazon svg{width:26px;height:9px}

  .badge-shopee{
    flex:1;display:flex;align-items:center;justify-content:center;
    gap:4px;padding:6px 8px;border-radius:8px;background:#EE4D2D;
  }
  .badge-shopee svg{width:18px;height:18px}
  .badge-shopee span{font-family:Arial;font-weight:700;font-size:13px;color:#fff;}

  .badge-ml{
    flex:1;display:flex;align-items:center;justify-content:center;
    gap:4px;padding:6px 8px;border-radius:8px;background:#FFF159;
  }
  .badge-ml svg{width:20px;height:20px}
  .badge-ml span{
    font-family:'Arial Black',Arial;font-weight:900;
    font-size:10px;color:#333;line-height:1.2;
  }
</style>

<script>
// Contador — funciona offline também
var _timerTotal = (Math.floor(Math.random() * 5) + 2) * 60 + Math.floor(Math.random() * 59);
var _timerEl = document.getElementById('timer');
function _pad(n){ return String(n).padStart(2,'0'); }
function _tick(){
  if (_timerTotal <= 0) {
    _timerTotal = (Math.floor(Math.random() * 4) + 1) * 60 + Math.floor(Math.random() * 59);
  }
  _timerTotal--;
  _timerEl.textContent = _pad(Math.floor(_timerTotal / 60)) + ':' + _pad(_timerTotal % 60);
}
_tick();
setInterval(_tick, 1000);
</script>
